{% extends "base.html" %}
{% block title %}Log in | Muse Copywriter{% endblock %}
{% block content %}
<section class="auth">
  <h1>Log in</h1>
  <form method="post" class="form">
    <label>Email <input type="email" name="email" value="{{ email or '' }}" autocomplete="email" required></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="muted">No account yet? <a href="{{ url_for('signup') }}">Create one</a></p>
</section>
{% endblock %}
